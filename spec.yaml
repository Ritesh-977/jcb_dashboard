spec:
  containers:
    - name: api-backend
      image: /MY_DASHBOARD/PUBLIC/my-repo/api-backend:v1.0
      readinessProbe:
        port: 8000
        path: /health

    - name: dashboard-website
      image: /MY_DASHBOARD/PUBLIC/my-repo/dashboard-website:v1.0
      readinessProbe:
        port: 3000
        path: /

    - name: admin-website
      image: /MY_DASHBOARD/PUBLIC/my-repo/admin-website:v1.0
      readinessProbe:
        port: 3001
        path: /

  endpoints:
    - name: api
      port: 8000
      public: true
    - name: dashboard
      port: 3000
      public: true
    - name: admin
      port: 3001
      public: true

  ingress:
    auth:
      type: none